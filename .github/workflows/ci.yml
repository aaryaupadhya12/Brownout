# Docs/SHIPPING.md, enforced on GitHub: the same check the pre-commit hook runs, over every
# tracked file, on every push and pull request. Actions are pinned by commit SHA.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ship-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: ship_check (paths, secrets, file sizes, line limits, offline tests with network blocked)
        run: uv run python scripts/ship_check.py --all
