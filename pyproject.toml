[project]
name = "brownout"
version = "0.1.0a1"
description = "An RL environment harness that checks how an agent reached its answer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==3.55.1",
    "pydantic==2.14.4",   # Cloud-OpsBench tool schemas (src/envs/SystemEnv/cloudops/vendor)
]

[dependency-groups]
# Harbor sandboxes for the LiveCodeBench tasks. Not needed for the offline tests.
harbor = ["harbor==0.26.0"]

[tool.uv]
package = false            # a repo of modules run with `python -m`, not an installable package
default-groups = []        # `uv sync` installs only what the offline tests need
# Resolve as if it were this date, so the lock is the same on every machine. Move it forward on
# purpose (and re-run the tests) when upgrading; never let it drift.
exclude-newer = "2026-11-23T00:00:00Z"
